[package]
name = "makruk-engine"
version = "0.1.0"
edition = "2021"
description = "Lightweight Makruk (Thai chess) engine for the browser: Rust core, WASM build, UCI-compatible worker."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "makruk-engine"
path = "src/main.rs"

# Pinned exact: the wasm-bindgen crate and the `wasm-bindgen` CLI schema must
# match byte-for-byte or the WASM build fails. Cargo.lock is gitignored, so a
# caret req would float to the latest release and mismatch the pinned 0.2.100
# CLI. See AGENTS.md invariants.
[dependencies]
wasm-bindgen = "=0.2.100"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.77"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
